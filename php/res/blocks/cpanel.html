    <h2>Letters</h2>
    <table id="letterList">
        <thead>
            <tr><th>Status</th><th>Created</th><th>Sender</th><th>ReceiverID</th></tr>
        </thead>
        <tbody id="letterListBody"></tbody>
    </table>
    <input hidden id="utoken" value="*UTOKEN*">
